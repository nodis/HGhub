name: Generate Signing Key (一次性)

# 用途：在构建机上生成一张安卓签名证书，下载后存进仓库加密变量，用完即删。
# 本机没有 JDK，keytool 跑不了，所以借 GitHub 的机器做这一件事。

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 生成 JKS 证书
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore hghub.jks \
            -alias hghub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype JKS \
            -storepass 'HghubSign2026' -keypass 'HghubSign2026' \
            -dname "CN=HGhub, OU=Self, O=Self, L=Jinan, ST=Shandong, C=CN"
          echo "--- 证书摘要 ---"
          keytool -list -keystore hghub.jks -storepass 'HghubSign2026' | head -20
          base64 -w0 hghub.jks > hghub.jks.b64
          echo "base64 长度: $(wc -c < hghub.jks.b64)"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: hghub.jks.b64
          retention-days: 1
          if-no-files-found: error
