name: Build Android APK

# 手动出包：选 ABI，用仓库里固定的签名证书，出包后发 Release 并推企业微信。
# 日常不需要手动点，auto-sync-build.yml 会在上游更新时自动跑。
# 这里留着是为了临时出一版、或者自动流程挂掉时手动补一版。

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "目标 ABI（vivo/绝大多数国产机选 aarch64）"
        required: true
        default: aarch64
        type: choice
        options:
          - aarch64
          - armv7
          - x86_64
          - i686

concurrency:
  group: android-apk-manual-${{ inputs.abi }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: "true"

jobs:
  android:
    name: Android APK (${{ inputs.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="manual-$(date -u +%Y%m%d-%H%M)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "打包版本 $V，目标 ABI ${{ inputs.abi }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK / NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-${{ inputs.abi }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK
        run: pnpm tauri android build --apk --target ${{ inputs.abi }}

      - name: 用固定证书签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
          ABI: ${{ inputs.abi }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64，请先配置签名证书"
            exit 1
          fi
          KS="$RUNNER_TEMP/hghub.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"

          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p out
          n=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f); do
            out="out/HGhub_${VERSION}_${ABI}.apk"
            [ "$n" -eq 0 ] || out="out/HGhub_${VERSION}_${ABI}_${n}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "${KEY_ALIAS:?缺少 ANDROID_KEY_ALIAS}" \
              --ks-pass "pass:${STORE_PASSWORD:?缺少 ANDROID_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD:?缺少 ANDROID_KEY_PASSWORD}" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            n=$((n+1))
          done
          [ "$n" -gt 0 ] || { echo "::error::没有找到编译出来的 APK"; exit 1; }
          rm -f "$KS"
          ls -lh out
          echo "SIZE=$(du -h out/*.apk | head -1 | cut -f1)" >> "$GITHUB_ENV"

      - name: 发布 Release
        id: rel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: HGhub ${{ steps.ver.outputs.version }} · 手动 · ${{ inputs.abi }}
          files: out/*.apk
          fail_on_unmatched_files: true
          body: |
            手动触发构建。

            - 客户端版本：${{ steps.ver.outputs.version }}
            - 架构：${{ inputs.abi }}
            - 签名：固定证书，可覆盖升级

      - name: 推送到企业微信
        if: success()
        env:
          WECOM: ${{ secrets.WECOM_WEBHOOK }}
          VERSION: ${{ steps.ver.outputs.version }}
          ABI: ${{ inputs.abi }}
          REL: ${{ steps.rel.outputs.url }}
        run: |
          set -euo pipefail
          [ -n "${WECOM:-}" ] || { echo "未配置 WECOM_WEBHOOK，跳过"; exit 0; }
          CONTENT="## HGhub 手动出包完成
          > 版本：${VERSION}（${ABI}）
          > 大小：${SIZE:-未知}
          > 固定证书签名，可覆盖升级

          [点此下载 APK](${REL})"
          PAYLOAD="$(python3 -c 'import json,sys;print(json.dumps({"msgtype":"markdown","markdown":{"content":sys.argv[1]}}))' "$CONTENT")"
          curl -sS -X POST "$WECOM" -H 'Content-Type: application/json' -d "$PAYLOAD" | head -c 300
          echo

      - name: 构建失败通知
        if: failure()
        env:
          WECOM: ${{ secrets.WECOM_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "${WECOM:-}" ] || exit 0
          CONTENT="## HGhub 手动构建失败
          [查看日志](${RUN_URL})"
          PAYLOAD="$(python3 -c 'import json,sys;print(json.dumps({"msgtype":"markdown","markdown":{"content":sys.argv[1]}}))' "$CONTENT")"
          curl -sS -X POST "$WECOM" -H 'Content-Type: application/json' -d "$PAYLOAD" | head -c 300
          echo
